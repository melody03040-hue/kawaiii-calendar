<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的可愛行事曆</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  background:#fff9f7;
  color:#554b4b;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding:24px 18px 110px;
}

.hero{
  position:relative;
  min-height:190px;
  padding:24px 18px;
  border-radius:32px;
  background:
    radial-gradient(circle at 15% 20%,#fff 0 4px,transparent 5px),
    linear-gradient(145deg,#fff7f8,#fdecef);
  box-shadow:0 12px 35px rgba(215,155,166,.13);
  overflow:hidden;
}

.hero h1{
  margin:0;
  font-size:34px;
  letter-spacing:2px;
}

.hero p{
  margin:9px 0 0;
  color:#a49292;
  font-size:16px;
}

.bunny{
  position:absolute;
  right:18px;
  bottom:-3px;
  width:120px;
  height:145px;
}

.ear{
  position:absolute;
  top:0;
  width:37px;
  height:82px;
  background:#fff;
  border:3px solid #f3c9d1;
  border-radius:50% 50% 42% 42%;
  box-shadow:inset 0 0 0 8px #fff6f7;
}

.ear:after{
  content:"";
  position:absolute;
  inset:12px 9px;
  background:#f8cbd5;
  border-radius:50%;
}

.ear.left{
  left:19px;
  transform:rotate(-9deg);
}

.ear.right{
  right:19px;
  transform:rotate(9deg);
}

.face{
  position:absolute;
  left:9px;
  bottom:4px;
  width:102px;
  height:92px;
  background:linear-gradient(#fff,#fff9fa);
  border:3px solid #f3c9d1;
  border-radius:48% 48% 45% 45%;
  box-shadow:0 8px 18px rgba(218,157,169,.18);
}

.eye{
  position:absolute;
  top:35px;
  width:8px;
  height:11px;
  background:#574a4a;
  border-radius:50%;
}

.eye.left{left:27px;}
.eye.right{right:27px;}

.nose{
  position:absolute;
  top:50px;
  left:44px;
  width:11px;
  height:8px;
  background:#e99eaf;
  border-radius:50% 50% 60% 60%;
}

.cheek{
  position:absolute;
  top:53px;
  width:17px;
  height:9px;
  background:#ffdce3;
  border-radius:50%;
}

.cheek.left{left:10px;}
.cheek.right{right:10px;}

.bow{
  position:absolute;
  right:0;
  top:69px;
  width:47px;
  height:31px;
}

.bow:before,
.bow:after{
  content:"";
  position:absolute;
  width:23px;
  height:25px;
  background:#eda5b7;
  border-radius:60% 40% 55% 45%;
  border:2px solid #df8fa4;
}

.bow:before{
  left:0;
  transform:rotate(20deg);
}

.bow:after{
  right:0;
  transform:rotate(-20deg);
}

.bow span{
  position:absolute;
  left:18px;
  top:8px;
  width:13px;
  height:13px;
  background:#f8c0cc;
  border:2px solid #df8fa4;
  border-radius:50%;
  z-index:2;
}
</style>
</head>

<body>

<div class="app">

  <section class="hero">

    <h1>我的行事曆 ♡</h1>
    <p>把每一天，都過成喜歡的樣子</p>

    <div class="bunny">
      <div class="ear left"></div>
      <div class="ear right"></div>

      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>

      <div class="bow"><span></span></div>
    </div>

  </section>

</div>

</body>
</html>
