<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f7">
<title>我的精緻兔兔行事曆</title>

<style>
/* ===== 精緻可愛插圖素材 ===== */
.kawaii-decor{
  background-image:url('kawaii-decor.png.png');
  background-repeat:no-repeat;
  background-size:100% auto;
}
  :root{
  --bg:#fff9f7;
  --card:#ffffff;
  --ink:#5d4b4b;
  --muted:#a99393;
  --pink:#ef91ad;
  --pink2:#ffdce6;
  --line:#f1dddd;
  --shadow:0 12px 30px rgba(180,120,135,.12);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 8% 10%,#fff1f5 0 30px,transparent 31px),
    radial-gradient(circle at 95% 30%,#fff0f4 0 26px,transparent 27px),
    linear-gradient(#fff8f7,#fffdfc);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  color:var(--ink);
}

button{
  font:inherit;
  color:inherit;
}

.app{
  width:100%;
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding:18px 16px 106px;
  position:relative;
}

/* ===== 裝飾 ===== */
.float-decor{
  position:absolute;
  pointer-events:none;
  z-index:1;
  opacity:.9;
}

.flower1{
  top:255px;
  left:7px;
  font-size:27px;
  transform:rotate(-12deg);
}

.flower2{
  top:285px;
  right:4px;
  font-size:24px;
  transform:rotate(12deg);
}

.bow1{
  top:520px;
  right:9px;
  font-size:30px;
  transform:rotate(8deg);
}

.spark1{
  top:610px;
  left:8px;
  font-size:22px;
}

.tulip1{
  top:850px;
  right:5px;
  font-size:27px;
}

.heart1{
  top:1000px;
  left:8px;
  font-size:24px;
}

/* ===== 精緻兔兔首頁橫幅 ===== */
.hero{
  width:100%;
  aspect-ratio:1024/430;
  border:1px solid #f6e3e7;
  border-radius:30px;
  background-image:url('IMG_6464.png');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
  z-index:2;
}

/* ===== 分頁 ===== */
.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:16px 0;
  position:relative;
  z-index:2;
}

.tab{
  border:0;
  background:#fff;
  border-radius:19px;
  padding:12px 5px;
  box-shadow:0 5px 16px rgba(175,130,139,.08);
  font-weight:800;
  font-size:14px;
}

.tab.active{
  background:linear-gradient(145deg,#f29bb5,#ed88a8);
  color:white;
}

.tab .icon{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

/* ===== 月曆卡片 ===== */
.panel{
  background:rgba(255,255,255,.97);
  border:1px solid #f5e3e6;
  border-radius:30px;
  padding:18px 14px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
  z-index:2;
}

.panel:before{
  content:"";
  position:absolute;
  width:95px;
  height:95px;
  right:-30px;
  top:-30px;
  border-radius:50%;
  background:radial-gradient(circle,#fff0f4 0 35%,transparent 36%);
  opacity:.7;
}

.panel:after{
  content:"♡  ✦";
  position:absolute;
  right:18px;
  bottom:9px;
  color:#f0b0c2;
  font-size:13px;
  letter-spacing:4px;
}

.monthbar{
  display:grid;
  grid-template-columns:50px 1fr 58px 50px;
  gap:7px;
  align-items:center;
  margin-bottom:15px;
  position:relative;
  z-index:2;
}

.monthbar h2{
  text-align:center;
  margin:0;
  font-size:27px;
  white-space:nowrap;
}

.round{
  height:48px;
  border:0;
  border-radius:17px;
  background:#fff0f4;
  font-weight:900;
  font-size:20px;
}

.today{
  font-size:14px;
}

.weekdays,
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  position:relative;
  z-index:2;
}

.weekdays div{
  text-align:center;
  color:#9f8d8d;
  font-size:13px;
  padding:5px 0 8px;
}

.day{
  min-height:54px;
  border:1px solid #f2e1e1;
  border-radius:16px;
  background:#fff;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  padding:8px;
  font-weight:800;
  position:relative;
}

.day.muted{
  color:#c9baba;
  background:#fffafa;
}

.day.todaymark{
  border:2px solid #ef9bb0;
  background:#fff1f5;
}

.day.todaymark:after{
  content:"";
  position:absolute;
  left:50%;
  bottom:5px;
  width:7px;
  height:7px;
  background:#ee91a8;
  border-radius:50%;
  transform:translateX(-50%);
}

/* ===== 今日想記什麼 ===== */
.quick-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 2px 10px;
}

.quick-title h3{
  margin:0;
  font-size:17px;
}

.decorline{
  display:flex;
  align-items:center;
  gap:5px;
  color:#e99ab1;
  font-size:18px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.chip{
  border:1px solid #f3e3e3;
  border-radius:17px;
  padding:12px 4px;
  text-align:center;
  font-size:13px;
  font-weight:800;
  min-height:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.chip .art{
  display:block;
  width:36px;
  height:36px;
  margin-bottom:6px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:21px;
  background:rgba(255,255,255,.7);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9);
}

.c1{background:#eef8ff}
.c2{background:#fff0f4}
.c3{background:#fff8df}
.c4{background:#effaf0}
.c5{background:#f7efff}
.c6{background:#fff3eb}

/* ===== 手帳小卡 ===== */
.diary-card{
  margin-top:16px;
  border:1px solid #f1e1e3;
  border-radius:22px;
  background:linear-gradient(145deg,#fff8fa,#fffdfc);
  padding:16px;
  position:relative;
  overflow:hidden;
}

.diary-card:before{
  content:"🎀";
  position:absolute;
  right:14px;
  top:9px;
  font-size:24px;
}

.diary-card:after{
  content:"🌷";
  position:absolute;
  right:18px;
  bottom:8px;
  font-size:25px;
}

.diary-card strong{
  display:block;
  color:#db819d;
  margin-bottom:6px;
}

.diary-card p{
  margin:0;
  color:#8f7474;
  line-height:1.7;
  font-size:13px;
  padding-right:45px;
}

/* ===== 其他頁 ===== */
.view{display:none}
.view.active{display:block}

.empty{
  padding:35px 18px;
  text-align:center;
  color:#9e8989;
}

.empty h2{
  color:#655050;
  margin-top:0;
}

.pretty-box{
  margin:18px auto 0;
  max-width:270px;
  border-radius:24px;
  background:linear-gradient(145deg,#fff6f9,#ffedf2);
  padding:22px;
  border:1px solid #f7e1e7;
  position:relative;
}

.pretty-box:before{
  content:"❀";
  position:absolute;
  left:12px;
  top:10px;
  color:#ecadc0;
  font-size:20px;
}

.pretty-box:after{
  content:"♡";
  position:absolute;
  right:12px;
  bottom:8px;
  color:#ecadc0;
  font-size:22px;
}

.settings-card{
  background:#fff;
  border:1px solid #f2e1e1;
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
}

.settings-card strong{
  display:block;
  margin-bottom:5px;
}

/* ===== 底部導覽 ===== */
.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(430px,100%);
  height:82px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid #f4e1e1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:20;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav{
  border:0;
  background:transparent;
  font-size:12px;
  color:#8e7d7d;
  font-weight:700;
}

.nav .icon{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.nav.active{
  color:#e47f9a;
}
</style>
</head>

<body>

<div class="app">

  <span class="float-decor flower1">❀</span>
  <span class="float-decor flower2">🌸</span>
  <span class="float-decor bow1">🎀</span>
  <span class="float-decor spark1">✦</span>
  <span class="float-decor tulip1">🌷</span>
  <span class="float-decor heart1">♡</span>

  <section class="hero"></section>

  <div class="tabs">

    <button class="tab active" data-view="calendar">
      <span class="icon">♡</span>
      月曆
    </button>

    <button class="tab" data-view="today">
      <span class="icon">✦</span>
      今日
    </button>

    <button class="tab" data-view="theme">
      <span class="icon">❀</span>
      主題
    </button>

    <button class="tab" data-view="settings">
      <span class="icon">⋯</span>
      設定
    </button>

  </div>

  <main id="calendar" class="view active">

    <section class="panel">

      <div class="monthbar">

        <button class="round" id="prev">
          ‹
        </button>

        <h2 id="monthTitle"></h2>

        <button class="round today" id="todayBtn">
          今天
        </button>

        <button class="round" id="next">
          ›
        </button>

      </div>

      <div class="weekdays">
        <div>日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div>六</div>
      </div>

      <div
        class="calendar"
        id="calendarGrid">
      </div>

    </section>

    <div class="quick-title">

      <h3>今天想記什麼？</h3>

      <div class="decorline">
        ♡ ❀ ✦
      </div>

    </div>

    <div class="quick">

      <div class="chip c1">
        <span class="art">📖</span>
        上課
      </div>

      <div class="chip c2">
        <span class="art">👜</span>
        工作
      </div>

      <div class="chip c3">
        <span class="art">🎂</span>
        生日
      </div>

      <div class="chip c4">
        <span class="art">✦</span>
        運動
      </div>

      <div class="chip c5">
        <span class="art">☕</span>
        生活
      </div>

      <div class="chip c6">
        <span class="art">☆</span>
        其他
      </div>

    </div>

    <div class="diary-card">

      <strong>♡ 今日小語</strong>

      <p>
        把小小的日子，過成閃閃發光的喜歡。
      </p>

    </div>

  </main>

  <main id="today" class="view">

    <section class="panel empty">

      <h2>今日 ♡</h2>

      <p id="todayText"></p>

      <div class="pretty-box">
        🌷 今天也要加油呀！
      </div>

    </section>

  </main>

  <main id="theme" class="view">

    <section class="panel empty">

      <h2>粉色兔兔主題</h2>

      <div class="pretty-box">
        🎀 奶油粉 × 小花 × 愛心 × 鬱金香
      </div>

    </section>

  </main>

  <main id="settings" class="view">

    <div class="settings-card">
      <strong>目前主題</strong>
      <span>精緻粉色兔兔</span>
    </div>

    <div class="settings-card">
      <strong>裝飾風格</strong>
      <span>蝴蝶結、小花、愛心、鬱金香、閃閃</span>
    </div>

  </main>

</div>

<nav class="bottom">

  <button class="nav active" data-view="calendar">
    <span class="icon">⌂</span>
    首頁
  </button>

  <button class="nav" data-view="today">
    <span class="icon">✦</span>
    今日
  </button>

  <button class="nav" data-view="theme">
    <span class="icon">❀</span>
    主題
  </button>

  <button class="nav" data-view="settings">
    <span class="icon">⚙</span>
    設定
  </button>

</nav>

<script>
let cursor = new Date();

const grid =
  document.getElementById('calendarGrid');

const title =
  document.getElementById('monthTitle');

function render(){

  const y =
    cursor.getFullYear();

  const m =
    cursor.getMonth();

  title.textContent =
    `${y} 年 ${m + 1} 月`;

  grid.innerHTML = '';

  const first =
    new Date(y,m,1).getDay();

  const days =
    new Date(y,m+1,0).getDate();

  const prevDays =
    new Date(y,m,0).getDate();

  const now =
    new Date();

  for(let i=0;i<42;i++){

    let d;
    let cls='day';
    let dateObj;

    if(i<first){

      d=
        prevDays-first+i+1;

      cls+=' muted';

      dateObj=
        new Date(y,m-1,d);

    }else if(i>=first+days){

      d=
        i-first-days+1;

      cls+=' muted';

      dateObj=
        new Date(y,m+1,d);

    }else{

      d=
        i-first+1;

      dateObj=
        new Date(y,m,d);
    }

    if(
      dateObj.toDateString()===
      now.toDateString()
    ){
      cls+=' todaymark';
    }

    const el=
      document.createElement('div');

    el.className=
      cls;

    el.textContent=
      d;

    grid.appendChild(el);
  }
}

document
  .getElementById('prev')
  .onclick=()=>{

    cursor.setMonth(
      cursor.getMonth()-1
    );

    render();
};

document
  .getElementById('next')
  .onclick=()=>{

    cursor.setMonth(
      cursor.getMonth()+1
    );

    render();
};

document
  .getElementById('todayBtn')
  .onclick=()=>{

    cursor=
      new Date();

    render();
};

function switchView(id){

  document
    .querySelectorAll('.view')
    .forEach(v=>{

      v.classList.toggle(
        'active',
        v.id===id
      );

    });

  document
    .querySelectorAll('[data-view]')
    .forEach(b=>{

      b.classList.toggle(
        'active',
        b.dataset.view===id
      );

    });
}

document
  .querySelectorAll('[data-view]')
  .forEach(b=>{

    b.onclick=()=>switchView(
      b.dataset.view
    );

  });

const n=
  new Date();

document
  .getElementById('todayText')
  .textContent=
    `${n.getFullYear()} 年 ${n.getMonth()+1} 月 ${n.getDate()} 日`;

render();
</script>

</body>
</html>
